name: work_vault
description: "Resumable HTTPS GET downloads for Flutter across Android, iOS, Windows, Linux, and Web."
version: 0.2.0
homepage: https://pub.dev/packages/work_vault
topics:
  - http
  - network
  - files

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path: ^1.9.0
  sqlite3: ^3.7.0
  web: '>=0.5.1 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.4

flutter:
  plugin:
    platforms:
      android:
        package: com.workvault.work_vault
        pluginClass: WorkVaultPlugin
      ios:
        pluginClass: WorkVaultPlugin
      windows:
        dartPluginClass: WorkVaultWindows
      linux:
        dartPluginClass: WorkVaultLinux
      web:
        pluginClass: WorkVaultWeb
        fileName: src/web/work_vault_web.dart
