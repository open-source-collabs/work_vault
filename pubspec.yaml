name: work_vault
description: "Resumable HTTPS GET downloads for Flutter across Android, iOS, Windows, Linux, and Web."
version: 0.2.0
repository: https://github.com/open-source-collabs/work_vault
issue_tracker: https://github.com/open-source-collabs/work_vault/issues
topics:
  - http
  - network
  - files

screenshots:
  - description: 'How work_vault works: a typed Dart control plane over WorkManager, background URLSession, desktop streaming and web, sharing one SQLite file.'
    path: screenshots/how-it-works.png
  - description: 'The six task statuses and the legal pause, resume and cancel transitions.'
    path: screenshots/lifecycle.png
  - description: 'Quickstart: initialize, enqueue a resumable download, and watch its progress.'
    path: screenshots/quickstart.png

false_secrets:
  - example/tool/certs/key.pem

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  crypto: ^3.0.7
  meta: ^1.19.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path: ^1.9.0
  sqlite3: ^3.7.0
  web: '>=0.5.1 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.4

flutter:
  plugin:
    platforms:
      android:
        package: com.workvault.work_vault
        pluginClass: WorkVaultPlugin
      ios:
        pluginClass: WorkVaultPlugin
      windows:
        dartPluginClass: WorkVaultWindows
      linux:
        dartPluginClass: WorkVaultLinux
      web:
        pluginClass: WorkVaultWeb
        fileName: src/web/work_vault_web.dart
