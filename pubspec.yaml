name: work_vault
description: "Resumable HTTPS GET downloads for Flutter. Work continues in WorkManager on Android and a background URLSession on iOS."
version: 0.1.0
homepage: https://pub.dev/packages/work_vault
topics:
  - http
  - network
  - files

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  sqlite3: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.4

flutter:
  plugin:
    platforms:
      android:
        package: com.workvault.work_vault
        pluginClass: WorkVaultPlugin
      ios:
        pluginClass: WorkVaultPlugin
