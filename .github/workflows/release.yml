name: Release

# Publishes to pub.dev through automated publishing (GitHub OIDC), so no token
# is stored. One-time setup on pub.dev: Admin > Automated publishing > enable
# publishing from GitHub Actions, repository open-source-collabs/work_vault,
# tag pattern `v{{version}}`, and require the `pub.dev` environment.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag and run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tag matches pubspec version
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version v$VERSION" >&2
            exit 1
          fi
      - name: Versions agree
        run: dart run tool/check_versions.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/web
      - run: dart pub publish --dry-run

  publish:
    name: Publish to pub.dev
    needs: verify
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      # A version published by hand (`dart pub publish`) cannot be published
      # again, so skip the upload instead of failing. The GitHub release job
      # still runs. Any answer other than 200 or 404 fails the job, so a
      # pub.dev outage never looks like "not published yet".
      - name: Check whether this version is already on pub.dev
        id: published
        run: |
          NAME=$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pub.dev/api/packages/$NAME/versions/$VERSION")
          case "$STATUS" in
            200)
              echo "::notice::$NAME $VERSION is already on pub.dev; skipping publish."
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "pub.dev answered HTTP $STATUS for $NAME $VERSION" >&2
              exit 1
              ;;
          esac
      - uses: subosito/flutter-action@v2
        if: steps.published.outputs.exists != 'true'
        with:
          channel: stable
          cache: true
      # Exchanges the OIDC token for pub.dev credentials.
      - uses: dart-lang/setup-dart@v1
        if: steps.published.outputs.exists != 'true'
      - run: flutter pub get
        if: steps.published.outputs.exists != 'true'
      # pub.dev documents `dart pub publish` for OIDC publishing; the OIDC
      # token is created by setup-dart above. FLUTTER_ROOT (set by
      # flutter-action) lets `dart pub` resolve the Flutter SDK dependency, as
      # the dry runs in ci.yml already do.
      - run: dart pub publish --force
        if: steps.published.outputs.exists != 'true'

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v "$" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $VERSION" >&2
            exit 1
          fi
      # A release made by hand for this tag is kept as it is, not replaced.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
